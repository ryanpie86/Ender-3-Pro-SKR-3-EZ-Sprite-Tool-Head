<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<style>
:root {
  --bg: #eef1f4; --panel: #ffffff; --fg: #1d2630; --muted: #5d6b7a; --line: #d3dae2;
  --accent: #2b6cb0; --accent-fg: #ffffff; --canvas: #e4e9ee;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b21; --panel: #1f262e; --fg: #e6ebf0; --muted: #98a6b5; --line: #323c47;
  --accent: #6aa7e8; --accent-fg: #0e1419; --canvas: #1a2027; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161b21; --panel: #1f262e; --fg: #e6ebf0; --muted: #98a6b5; --line: #323c47;
  --accent: #6aa7e8; --accent-fg: #0e1419; --canvas: #1a2027; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; }
header .sub { color: var(--muted); font-size: 12.5px; }
nav { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
nav button { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
nav button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
main { flex: 1; min-height: 320px; position: relative; display: flex; flex-direction: column; }
#stage { flex: 1; min-height: 300px; background: var(--canvas); touch-action: none; position: relative; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; left: 12px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.hud label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 9px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
.hint { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; }
aside { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 14px; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-variant-numeric: tabular-nums; }
dt { color: var(--muted); } dd { margin: 0; font-family: var(--font-mono); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--sw); }
@media (max-width: 520px) { dl { grid-template-columns: 1fr; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
</head>
<body>
<header>
  <div><h1>__TITLE__</h1><div class="sub">__SUBTITLE__</div></div>
  <nav id="views" aria-label="View"></nav>
</header>
<main>
  <div id="stage">
    <div class="hud">
      <label><input type="checkbox" id="ctx" checked> Beam</label>
      <label><input type="checkbox" id="hw" checked> Hardware</label>
      <label><input type="checkbox" id="wire"> Edges</label>
    </div>
    <div class="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan</div>
  </div>
  <aside>
    <h2 id="factsTitle"></h2>
    <dl id="facts"></dl>
    <div class="legend">
      __LEGEND__
    </div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = __DATA__;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 1, 5000);
camera.up.set(0, 0, 1);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(-120, -200, 260); scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xffffff, 0.25); sun2.position.set(200, 120, 80); scene.add(sun2);
function parseSTL(b64) {
  const bin = atob(b64); const buf = new ArrayBuffer(bin.length); const u8 = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const dv = new DataView(buf); const n = dv.getUint32(80, true);
  const pos = new Float32Array(n * 9);
  for (let i = 0; i < n; i++) { const o = 84 + i * 50 + 12; for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(o + k * 4, true); }
  return pos;
}
const geoCache = {};
function geometry(key) {
  if (geoCache[key]) return geoCache[key];
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(parseSTL(DATA.models[key].stl), 3)); g.computeVertexNormals();
  return geoCache[key] = g;
}
let groups = { part: null, hw: null, ctx: null, wire: null };
let target = new THREE.Vector3(), radius = 200, theta = -0.9, phi = 1.05;
function show(id) {
  const v = DATA.views.find(x => x.id === id);
  Object.values(groups).forEach(g => g && scene.remove(g));
  groups = { part: new THREE.Group(), hw: new THREE.Group(), ctx: new THREE.Group(), wire: new THREE.Group() };
  const bbox = new THREE.Box3();
  v.parts.forEach(p => {
    const key = typeof p === 'string' ? p : p.key, at = (typeof p === 'string') ? [0, 0, 0] : (p.at || [0, 0, 0]);
    const m = DATA.models[key], g = geometry(key);
    const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: m.color, roughness: 0.65, metalness: m.kind === 'hw' ? 0.35 : 0.05, flatShading: true, side: THREE.DoubleSide, transparent: m.kind === 'ctx', opacity: m.kind === 'ctx' ? 0.45 : 1 }));
    mesh.position.set(at[0], at[1], at[2]);
    groups[m.kind].add(mesh);
    if (m.kind !== 'ctx') bbox.expandByObject(mesh);
    if (m.kind === 'part') { const w = new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.35 })); w.position.set(at[0], at[1], at[2]); groups.wire.add(w); }
  });
  Object.values(groups).forEach(g => scene.add(g));
  applyToggles();
  bbox.getCenter(target); const size = new THREE.Vector3(); bbox.getSize(size); radius = Math.max(size.x, size.y, size.z) * 1.9 + 30;
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
  document.getElementById('factsTitle').textContent = v.label;
  const dl = document.getElementById('facts'); dl.innerHTML = '';
  v.facts.forEach(([k, val]) => { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = val; dl.append(dt, dd); });
  try { localStorage.setItem('__STORAGE_KEY__', id); } catch (e) {}
}
function applyToggles() {
  groups.ctx.visible = document.getElementById('ctx').checked;
  groups.hw.visible = document.getElementById('hw').checked;
  groups.wire.visible = document.getElementById('wire').checked;
}
['ctx', 'hw', 'wire'].forEach(i => document.getElementById(i).addEventListener('change', applyToggles));
const nav = document.getElementById('views');
DATA.views.forEach(v => { const b = document.createElement('button'); b.textContent = v.label; b.dataset.id = v.id; b.addEventListener('click', () => show(v.id)); nav.appendChild(b); });
let drag = null, pinch = null;
const el = renderer.domElement;
el.addEventListener('contextmenu', e => e.preventDefault());
el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey, id: e.pointerId }; });
el.addEventListener('pointerup', e => { if (drag && drag.id === e.pointerId) drag = null; });
el.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const right = new THREE.Vector3().subVectors(camera.position, target).cross(camera.up).normalize();
    target.addScaledVector(right, dx * radius * 0.0015).addScaledVector(camera.up, dy * radius * 0.0015);
  } else { theta -= dx * 0.008; phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - dy * 0.008)); }
});
el.addEventListener('wheel', e => { e.preventDefault(); radius *= Math.exp(e.deltaY * 0.0012); radius = Math.min(2000, Math.max(20, radius)); }, { passive: false });
el.addEventListener('touchstart', e => { if (e.touches.length === 2) { drag = null; pinch = dist(e.touches); } }, { passive: true });
el.addEventListener('touchmove', e => { if (e.touches.length === 2 && pinch) { const d = dist(e.touches); radius *= pinch / d; pinch = d; e.preventDefault(); } }, { passive: false });
el.addEventListener('touchend', () => { pinch = null; });
function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);
function themeClear() { renderer.setClearColor(new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim() || '#e4e9ee')); }
themeClear();
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeClear);
function frame() {
  camera.position.set(target.x + radius * Math.sin(phi) * Math.cos(theta), target.y + radius * Math.sin(phi) * Math.sin(theta), target.z + radius * Math.cos(phi));
  camera.lookAt(target); renderer.render(scene, camera); requestAnimationFrame(frame);
}
resize();
let start = DATA.views[0].id; try { const s = localStorage.getItem('__STORAGE_KEY__'); if (s && DATA.views.some(v => v.id === s)) start = s; } catch (e) {}
show(start); frame();
</script>
</body>
</html>
