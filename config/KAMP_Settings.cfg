# KAMP (Klipper Adaptive Meshing & Purging) settings for the reference build.
# Install KAMP once (docs/04-mainsailos.md, section 4b); its install script
# symlinks ~/KAMP/Configuration to ~/printer_data/config/KAMP and drops a
# default KAMP_Settings.cfg there. Replace that default with this file.
#
# Only Smart Park and Line Purge are used. KAMP's own Adaptive_Meshing.cfg is
# NOT included: Klipper's native BED_MESH_CALIBRATE ADAPTIVE=1 (what START_PRINT
# runs) replaced it, and the two must not both be active.

[include ./KAMP/Smart_Park.cfg]
[include ./KAMP/Line_Purge.cfg]

[gcode_macro _KAMP_Settings]
description: KAMP settings; this macro only holds variables
variable_verbose_enable: True
variable_mesh_margin: 0
variable_fuzz_amount: 0
# Line purge, sized for the 0.8 nozzle on the Sprite Pro
variable_purge_height: 0.8          # nozzle height while purging (nozzle diameter)
variable_tip_distance: 0            # filament already at the nozzle
variable_purge_margin: 10           # purge line this far in front of the print area
variable_purge_amount: 40           # mm of filament; raise to 60 for PETG
variable_flow_rate: 20              # mm3/s; the 0.8 nozzle can take it
# Smart park
variable_smart_park_height: 10
gcode:
