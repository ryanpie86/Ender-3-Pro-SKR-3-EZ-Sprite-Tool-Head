# ADXL345 on a Raspberry Pi Pico (RP2040), plugged into the Pi by
# USB. The Pico runs its own Klipper firmware and appears as a second MCU; the sensor is already
# wired to it, so nothing touches the SKR 3 EZ. Klipper's own Pico wiring (docs/06). docs/06-tuning.md has the Pico firmware build and the calibration steps.
#
# Own file because Klipper refuses to start when an [mcu] is unplugged: uncomment
# "[include adxl.cfg]" in printer.cfg while the Pico is connected, comment it back out when done.

[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_<serial>-if00   # yours: ls /dev/serial/by-id/ with the Pico plugged in

[adxl345]
cs_pin: adxl:gpio1
spi_bus: spi0a
axes_map: x,y,z           # Adafruit board flat on the bed mount, header edge at the front, VIN left / SCL right:
                          # board X = printer X, board Y = printer Y. Check with ACCELEROMETER_QUERY: gravity must read on Z.

[resonance_tester]
accel_chip: adxl345
probe_points:
    117.5, 117.5, 60     # nozzle over the Ender 3 bed centre

[output_pin power_mode]   # Pico's SMPS into PWM mode: steadier 3.3 V, less noise in the readings
pin: adxl:gpio23
value: 1

# Dashboard buttons (Calibrate group in the Mainsail backup). SHAPER_PLOT, which renders the
# graphs, is in shell.cfg because it runs a script on the Pi.
[gcode_macro ADXL_CHECK]
description: Accelerometer sanity check: gravity (about 9800) must be on Z, noise well under 100 on all axes
gcode:
    ACCELEROMETER_QUERY
    MEASURE_AXES_NOISE

[gcode_macro SHAPER_X]
description: Input shaper calibration for X. Sensor on the TOOLHEAD mount. Needs a homed printer; SAVE_CONFIG afterwards writes the result
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        { action_raise_error("SHAPER_X: not while printing") }
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("SHAPER_X: home first (G28, or SET_KINEMATIC_POSITION Z=.. + G28.1 X Y when the bed is not clear)") }
    {% endif %}
    RESPOND TYPE=command MSG="SHAPER_X: sweeping 5-134 Hz on X, about 2 minutes. Then SHAPER_PLOT for the graph, SAVE_CONFIG to keep the result."
    SHAPER_CALIBRATE AXIS=X

[gcode_macro SHAPER_Y]
description: Input shaper calibration for Y. Sensor on the BED mount. Needs a homed printer; SAVE_CONFIG afterwards writes the result
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        { action_raise_error("SHAPER_Y: not while printing") }
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("SHAPER_Y: home first (G28, or SET_KINEMATIC_POSITION Z=.. + G28.1 X Y when the bed is not clear)") }
    {% endif %}
    RESPOND TYPE=command MSG="SHAPER_Y: sweeping 5-134 Hz on Y, about 2 minutes. Then SHAPER_PLOT for the graph, SAVE_CONFIG to keep the result."
    SHAPER_CALIBRATE AXIS=Y
