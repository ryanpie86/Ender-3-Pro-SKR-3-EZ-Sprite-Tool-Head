# Macros for the Ender 3 Pro / SKR 3 EZ build.
# PAUSE / RESUME / CANCEL_PRINT come from mainsail.cfg (MainsailOS ships it).
#
# Slicer start g-code (replace the slicer's own start code with this line):
#   PrusaSlicer / SuperSlicer / Orca:  START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
#   Cura:                             START_PRINT BED_TEMP={material_bed_temperature_layer_0} EXTRUDER_TEMP={material_print_temperature_layer_0}
# Slicer end g-code:
#   END_PRINT

########################################
# Automatic gantry levelling
#
# The two Z motors are on separate drivers, so Klipper can level the X
# gantry by probing over each lead screw (Z_TILT_ADJUST). This G28 override
# makes that automatic: every full home ends with a level gantry, and the
# gantry is re-levelled the next time it is homed after the motors have
# been powered down (M84, or a Klipper restart), because that is when it can drift.
# A manual G28 Z on its own does not re-level; use LEVEL_GANTRY to force it.
########################################

[gcode_macro G28]
rename_existing: G28.1
description: Home, then level the gantry with the two Z motors if it is not already level
gcode:
    G28.1 {rawparams}
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'x' in homed and 'y' in homed and 'z' in homed and not printer.z_tilt.applied and params|length == 0 %}
        M117 Levelling gantry
        Z_TILT_ADJUST
        G28.1 Z                           ; re-home Z: the tilt moved the Z zero
        M117 Gantry level
    {% endif %}

[gcode_macro LEVEL_GANTRY]
description: Force a gantry level now (homes first if needed)
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28.1
    {% endif %}
    Z_TILT_ADJUST
    G28.1 Z

[gcode_macro START_PRINT]
description: Heat, home + level gantry, adaptive mesh of the print area, KAMP smart park and line purge. Pass BED_TEMP and EXTRUDER_TEMP.
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    M117 Heating bed
    M140 S{BED_TEMP}                      ; start bed; the hotend heats after probing (M109 below)
    G90                                   ; absolute positioning
    M83                                   ; relative extrusion
    M190 S{BED_TEMP}                      ; wait for bed
    LEVEL_GANTRY                          ; home all + fresh Z_TILT_ADJUST every print
    M117 Bed mesh (print area)
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1         ; Klipper's native adaptive mesh: probes only where the objects are
    M117 Heating hotend
    SMART_PARK                            ; KAMP: wait beside the print area, not across the bed
    M109 S{EXTRUDER_TEMP}
    LINE_PURGE                            ; KAMP: purge line just in front of the print area
    {% set v = printer.save_variables.variables %}
    RESPOND MSG="Nozzle {v.nozzle|default(0.8)} mm, pressure advance {printer.extruder.pressure_advance} (smooth {printer.extruder.smooth_time})"
    M117 Printing

[gcode_macro END_PRINT]
description: Retract, present the print, heaters off
gcode:
    M83
    G91
    G1 E-2 F2700
    G1 E-2 Z0.2 F2400
    G1 X5 Y5 F3000
    G1 Z10 F3000                          ; lift
    G90
    {% set min_x = printer.toolhead.axis_minimum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    G1 X{min_x + 5} Y{max_y - 10} F3000   ; present the bed (X min is 1 on the reference build, so never a hard X0)
    M107                                  ; part fan off
    TURN_OFF_HEATERS
    M84                                   ; release all motors (Klipper's M84 ignores axis letters)
    M117 Done

[gcode_macro M600]
description: Filament change: pause and park (Mainsail's PAUSE), a short retract so the tip does not ooze. Change by hand, then RESUME.
gcode:
    PAUSE
    M83
    G1 E-5 F1800
    M117 Change filament, then RESUME

[gcode_macro PID_HOTEND]
description: PID tune the hotend at TEMP (default 210) with the part fan on
gcode:
    {% set TEMP = params.TEMP|default(210)|float %}
    M106 S255
    PID_CALIBRATE HEATER=extruder TARGET={TEMP}
    M107
    SAVE_CONFIG

[gcode_macro PID_BED]
description: PID tune the bed at TEMP (default 60)
gcode:
    {% set TEMP = params.TEMP|default(60)|float %}
    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}
    SAVE_CONFIG

[gcode_macro SCREWS_TILT]
description: Bed knobs (Y levelling): gantry level first, then probe by each screw and report the turns
gcode:
    LEVEL_GANTRY
    SCREWS_TILT_CALCULATE

[gcode_macro BED_LEVEL_CHECK]
description: Gantry level + knob report + full bed mesh, for a look at the whole bed
gcode:
    LEVEL_GANTRY
    SCREWS_TILT_CALCULATE
    BED_MESH_CALIBRATE

########################################
# SETUP HELPERS (make a Mainsail macro group of this name: Settings > Macros >
# add group "SETUP HELPERS" and tick these). Each buzzes one motor: it should
# move ~1 mm in the positive direction first, then back. Wrong way = flip the
# "!" on that stepper's dir_pin in printer.cfg. Both Z motors must LIFT.
########################################
[gcode_macro BUZZ_X]
description: Buzz the X motor (should move toward +X first)
gcode:
    M117 Buzzing X: watch for +X first
    STEPPER_BUZZ STEPPER=stepper_x

[gcode_macro BUZZ_Y]
description: Buzz the Y motor (bed should move so the nozzle goes toward +Y, i.e. the bed comes forward, first)
gcode:
    M117 Buzzing Y: bed should come FORWARD first
    STEPPER_BUZZ STEPPER=stepper_y

[gcode_macro BUZZ_Z]
description: Buzz the LEFT Z motor (gantry should lift first)
gcode:
    M117 Buzzing Z left: gantry should LIFT first
    STEPPER_BUZZ STEPPER=stepper_z

[gcode_macro BUZZ_Z1]
description: Buzz the RIGHT Z motor (gantry should lift first)
gcode:
    M117 Buzzing Z right: gantry should LIFT first
    STEPPER_BUZZ STEPPER=stepper_z1

[gcode_macro BUZZ_E]
description: Buzz the extruder (cold; the Sprite's gear should turn to push filament toward the nozzle first)
gcode:
    M117 Buzzing extruder: filament should feed IN first
    STEPPER_BUZZ STEPPER=extruder

[gcode_macro BUZZ_ALL]
description: Buzz all five motors in turn, X Y Z Z1 E, with a beep and a pause between each
gcode:
    {% for name in ["stepper_x", "stepper_y", "stepper_z", "stepper_z1", "extruder"] %}
        M117 Buzzing {name}
        BEEP
        STEPPER_BUZZ STEPPER={name}
        G4 P1500
    {% endfor %}
    M117 Buzz done

[gcode_macro BEEP]
description: One beep on the display's buzzer. BEEP DURATION=0.2 FREQ=1000
gcode:
    {% set D = params.DURATION|default(0.15)|float %}
    {% set F = params.FREQ|default(1000)|float %}
    SET_PIN PIN=_beeper VALUE=0.5 CYCLE_TIME={1.0 / F}
    G4 P{D * 1000}
    SET_PIN PIN=_beeper VALUE=0

[gcode_macro M300]
description: Marlin-style beep: M300 S<frequency> P<milliseconds>
gcode:
    {% set S = params.S|default(1000)|float %}
    {% set P = params.P|default(100)|float %}
    BEEP FREQ={S} DURATION={P / 1000.0}

[gcode_macro Z_LOCK]
description: Re-energise the Z motors after an M84 (END_PRINT and the 12 h idle timeout release them)
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1

### This is the SPEED TEST MACRO written by Andrew Ellis (ellis3dp.com).
### Please read the documentation before torturing your printer with it!
#
#     https://ellis3dp.com/Print-Tuning-Guide/articles/determining_max_speeds_accels.html
#
### Home, get position, throw around toolhead, home again.
### If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
### We only measure to a full step to accomodate for endstop variance.
### Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

[gcode_macro TEST_SPEED]
gcode:
	# Speed
	{% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
	# Iterations
	{% set iterations = params.ITERATIONS|default(5)|int %}
	# Acceleration
	{% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
	# Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
	{% set bound = params.BOUND|default(20)|int %}
	# Size for small pattern box
	{% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
	
	# Large pattern
		# Max positions, inset by BOUND
		{% set x_min = printer.toolhead.axis_minimum.x + bound %}
		{% set x_max = printer.toolhead.axis_maximum.x - bound %}
		{% set y_min = printer.toolhead.axis_minimum.y + bound %}
		{% set y_max = printer.toolhead.axis_maximum.y - bound %}
	
	# Small pattern at center
		# Find X/Y center point
		{% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
		{% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
		
		# Set small pattern box around center point
		{% set x_center_min = x_center - (smallpatternsize/2) %}
		{% set x_center_max = x_center + (smallpatternsize/2) %}
		{% set y_center_min = y_center - (smallpatternsize/2) %}
		{% set y_center_max = y_center + (smallpatternsize/2) %}

	# Save current gcode state (absolute/relative, etc)
	SAVE_GCODE_STATE NAME=TEST_SPEED
	
	# Output parameters to g-code terminal
	{ action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
	
	# Home and get position for comparison later:
		G28
		# QGL if not already QGLd (only if QGL section exists in config)
		{% if printer.configfile.settings.quad_gantry_level %}
			{% if printer.quad_gantry_level.applied == False %}
				QUAD_GANTRY_LEVEL
				G28 Z
			{% endif %}
		{% endif %}	
		G90
		G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
		G4 P1000 
		GET_POSITION

	# Go to starting position
	G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

	# Set new limits
	SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}

	{% for i in range(iterations) %}
		# Large pattern
			# Diagonals
			G0 X{x_min} Y{y_min} F{speed*60}
			G0 X{x_max} Y{y_max} F{speed*60}
			G0 X{x_min} Y{y_min} F{speed*60}
			G0 X{x_max} Y{y_min} F{speed*60}
			G0 X{x_min} Y{y_max} F{speed*60}
			G0 X{x_max} Y{y_min} F{speed*60}
			
			# Box
			G0 X{x_min} Y{y_min} F{speed*60}
			G0 X{x_min} Y{y_max} F{speed*60}
			G0 X{x_max} Y{y_max} F{speed*60}
			G0 X{x_max} Y{y_min} F{speed*60}
		
		# Small pattern
			# Small diagonals 
			G0 X{x_center_min} Y{y_center_min} F{speed*60}
			G0 X{x_center_max} Y{y_center_max} F{speed*60}
			G0 X{x_center_min} Y{y_center_min} F{speed*60}
			G0 X{x_center_max} Y{y_center_min} F{speed*60}
			G0 X{x_center_min} Y{y_center_max} F{speed*60}
			G0 X{x_center_max} Y{y_center_min} F{speed*60}
			
			# Small box
			G0 X{x_center_min} Y{y_center_min} F{speed*60}
			G0 X{x_center_min} Y{y_center_max} F{speed*60}
			G0 X{x_center_max} Y{y_center_max} F{speed*60}
			G0 X{x_center_max} Y{y_center_min} F{speed*60}
	{% endfor %}

	# Restore max speed/accel/accel_to_decel to their configured values
	SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel} 

	# Re-home and get position again for comparison:
		G28
		# Go to XY home positions (in case your homing override leaves it elsewhere)
		G90
		G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
		G4 P1000 
		GET_POSITION

	# Restore previous gcode state (absolute/relative, etc)
	RESTORE_GCODE_STATE NAME=TEST_SPEED

########################################
# Nozzle / filament buttons (NOZZLE / FILAMENT group on the dashboard)
########################################
# Klipper has no runtime nozzle setting. What depends on the nozzle at run time is the KAMP
# purge line: its height, flow rate and length. The buttons set those and remember the choice
# in variables.cfg ([save_variables] in printer.cfg); _APPLY_SAVED_SETTINGS re-applies it after
# every restart. nozzle_diameter in [extruder] only gates Klipper's extrusion sanity checks
# (max_extrude_cross_section is set explicitly) and stays as it is.
# Pressure advance works the same way: the button sets it now and remembers it.

[gcode_macro _NOZZLE_APPLY]
gcode:
    {% set d = params.D|float %}
    {% set flow = params.FLOW|float %}
    {% set amount = params.AMOUNT|float %}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=purge_height VALUE={d}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=flow_rate VALUE={flow}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=purge_amount VALUE={amount}
    {% if params.SAVE|default(1)|int %}
        SAVE_VARIABLE VARIABLE=nozzle VALUE={d}
        SAVE_VARIABLE VARIABLE=nozzle_flow VALUE={flow}
        SAVE_VARIABLE VARIABLE=nozzle_amount VALUE={amount}
    {% endif %}
    RESPOND MSG="Nozzle {d} mm: KAMP purge {amount|int} mm of filament at {flow|int} mm3/s, {d} mm high"

[gcode_macro NOZZLE_0_2]
description: 0.2 mm nozzle fitted: purge 15 mm at 4 mm3/s (remembered across restarts)
gcode:
    _NOZZLE_APPLY D=0.2 FLOW=4 AMOUNT=15

[gcode_macro NOZZLE_0_4]
description: 0.4 mm nozzle fitted: purge 25 mm at 8 mm3/s (remembered across restarts)
gcode:
    _NOZZLE_APPLY D=0.4 FLOW=8 AMOUNT=25

[gcode_macro NOZZLE_0_6]
description: 0.6 mm nozzle fitted: purge 30 mm at 14 mm3/s (remembered across restarts)
gcode:
    _NOZZLE_APPLY D=0.6 FLOW=14 AMOUNT=30

[gcode_macro NOZZLE_0_8]
description: 0.8 mm nozzle fitted: purge 40 mm at 20 mm3/s (remembered across restarts)
gcode:
    _NOZZLE_APPLY D=0.8 FLOW=20 AMOUNT=40

[gcode_macro PA_PLA_PETG]
description: Pressure advance 0.040, smooth time 0.040: PLA, PLA+, PETG (remembered across restarts)
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0.040 SMOOTH_TIME=0.040
    SAVE_VARIABLE VARIABLE=pa VALUE=0.040
    SAVE_VARIABLE VARIABLE=pa_smooth VALUE=0.040
    RESPOND MSG="Pressure advance 0.040, smooth time 0.040 (PLA / PLA+ / PETG)"

[gcode_macro PA_OFF_TPU]
description: Pressure advance off: TPU (remembered across restarts)
gcode:
    SET_PRESSURE_ADVANCE ADVANCE=0 SMOOTH_TIME=0.040
    SAVE_VARIABLE VARIABLE=pa VALUE=0
    SAVE_VARIABLE VARIABLE=pa_smooth VALUE=0.040
    RESPOND MSG="Pressure advance off (TPU)"

[delayed_gcode _APPLY_SAVED_SETTINGS]
initial_duration: 2
gcode:
    {% set v = printer.save_variables.variables %}
    {% if 'nozzle' in v %}
        _NOZZLE_APPLY D={v.nozzle} FLOW={v.nozzle_flow} AMOUNT={v.nozzle_amount} SAVE=0
    {% endif %}
    {% if 'pa' in v %}
        SET_PRESSURE_ADVANCE ADVANCE={v.pa} SMOOTH_TIME={v.pa_smooth|default(0.040)}
        RESPOND MSG="Pressure advance {v.pa} restored"
    {% endif %}

########################################
# Enclosure fan controller
########################################
# [controller_fan] only knows steppers and heaters. This loop adds the board temperature:
# the fan runs while any stepper is enabled or a heater has a target, for 60 s after that
# stops, and whenever the SKR 3's MCU reads 45 C or more, until it is back below 40 C.

[gcode_macro _ENCLOSURE_FAN]
variable_hold: 0          # 10 s ticks of run-on left after the last stepper/heater activity
variable_hot: 0           # 1 while the MCU is in the hot band (>= 45 C, cleared below 40 C)
variable_on_temp: 45.0
variable_off_temp: 40.0
variable_run_on_ticks: 6  # 6 x 10 s = 60 s, like the old controller_fan idle_timeout
gcode:

[delayed_gcode _ENCLOSURE_FAN_CTRL]
initial_duration: 5
gcode:
    {% set v = printer["gcode_macro _ENCLOSURE_FAN"] %}
    {% set mcu = printer["temperature_sensor skr3_mcu"].temperature|float %}
    {% set steppers_on = printer.stepper_enable.steppers.values()|select|list|length > 0 %}
    {% set heaters_on = printer.extruder.target|float > 0 or printer.heater_bed.target|float > 0 %}
    {% set hold = v.hold|int %}
    {% if steppers_on or heaters_on %}
        {% set hold = v.run_on_ticks|int %}
    {% elif hold > 0 %}
        {% set hold = hold - 1 %}
    {% endif %}
    {% set hot = v.hot|int %}
    {% if mcu >= v.on_temp|float %}
        {% set hot = 1 %}
    {% elif mcu < v.off_temp|float %}
        {% set hot = 0 %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ENCLOSURE_FAN VARIABLE=hold VALUE={hold}
    SET_GCODE_VARIABLE MACRO=_ENCLOSURE_FAN VARIABLE=hot VALUE={hot}
    {% set want = 1.0 if (hold > 0 or hot == 1) else 0.0 %}
    {% if (printer["fan_generic enclosure_fan"].speed|float - want)|abs > 0.01 %}
        SET_FAN_SPEED FAN=enclosure_fan SPEED={want}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_ENCLOSURE_FAN_CTRL DURATION=10

########################################
# Deferred runout: use the filament still in the tube before pausing
########################################
# The runout sensor sits at the top of the frame, a tube length away from the extruder. When it
# trips, the print continues until that length (less a margin so the tail is still in the gears)
# has been extruded, measured with Klipper's print_stats.filament_used, then M600 pauses, parks
# and retracts as usual. Measure TAIL_MM once: filament path from the sensor's switch to the
# Sprite's drive gear, along the tube, minus 30 mm.

[gcode_macro _RUNOUT]
variable_tail_mm: 450.0   # <-- CHECK: sensor -> extruder gear along the tube, minus 30 mm margin
variable_armed: 0
variable_target: 0.0
gcode:

[gcode_macro _RUNOUT_START]
gcode:
    {% set v = printer["gcode_macro _RUNOUT"] %}
    {% if printer.print_stats.state != "printing" %}
        M117 Filament runout
        RESPOND MSG="Runout sensor tripped while not printing; nothing to do"
    {% elif v.armed|int == 1 %}
        RESPOND MSG="Runout already armed"
    {% else %}
        {% set used = printer.print_stats.filament_used|float %}
        SET_GCODE_VARIABLE MACRO=_RUNOUT VARIABLE=armed VALUE=1
        SET_GCODE_VARIABLE MACRO=_RUNOUT VARIABLE=target VALUE={used + v.tail_mm|float}
        M117 Runout: using the tube
        RESPOND MSG="Runout: {v.tail_mm|int} mm of filament left between sensor and extruder; pausing when it is used"
        UPDATE_DELAYED_GCODE ID=_RUNOUT_WATCH DURATION=1
    {% endif %}

[gcode_macro _RUNOUT_INSERTED]
gcode:
    {% set v = printer["gcode_macro _RUNOUT"] %}
    {% if v.armed|int == 1 and printer.print_stats.state == "printing" %}
        SET_GCODE_VARIABLE MACRO=_RUNOUT VARIABLE=armed VALUE=0
        UPDATE_DELAYED_GCODE ID=_RUNOUT_WATCH DURATION=0
        M117 Runout cleared
        RESPOND MSG="Runout sensor sees filament again before the tube ran out; treated as a false trigger, printing on"
    {% else %}
        M117 Filament inserted: feed it to the nozzle, then RESUME
    {% endif %}

[delayed_gcode _RUNOUT_WATCH]
gcode:
    {% set v = printer["gcode_macro _RUNOUT"] %}
    {% if v.armed|int == 1 %}
        {% set st = printer.print_stats.state %}
        {% if st in ("complete", "cancelled", "error", "standby") %}
            SET_GCODE_VARIABLE MACRO=_RUNOUT VARIABLE=armed VALUE=0
        {% elif st == "printing" and printer.print_stats.filament_used|float >= v.target|float %}
            SET_GCODE_VARIABLE MACRO=_RUNOUT VARIABLE=armed VALUE=0
            RESPOND MSG="Runout: tube used up, pausing for a filament change"
            M600
        {% else %}
            UPDATE_DELAYED_GCODE ID=_RUNOUT_WATCH DURATION=1
        {% endif %}
    {% endif %}
