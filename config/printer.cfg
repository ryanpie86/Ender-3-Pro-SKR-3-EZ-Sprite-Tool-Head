# Klipper configuration: Creality Ender 3 Pro on a BIGTREETECH SKR 3 EZ
#
#   Board     : SKR 3 EZ (STM32H723 on this board; BTT advertises H743; 128KiB bootloader, 25 MHz, USB, Katapult)
#   Drivers   : 5 x EZ2209 in UART mode (X, Y, Z, E0, E1)
#   Z axis    : two independent motors. Left on ZAM -> [stepper_z],
#               right on E1M -> [stepper_z1]. Levelled with Z_TILT_ADJUST.
#   Toolhead  : Creality Sprite Pro (300 C all-metal) direct-drive extruder with the CR Touch on
#               its side bracket (same geometry as the Ender 3 S1; offsets,
#               gear ratio and PID start values come from Klipper's
#               printer-creality-ender3-s1-2021.cfg).
#   Host      : Raspberry Pi 4, MainsailOS.
#
# Pin names come from BTT's "SKR 3 EZ V1.0-PIN.pdf" and Klipper's
# config/generic-bigtreetech-skr-3.cfg. Ender 3 Pro frame geometry and the
# bed PID values come from Klipper's config/printer-creality-ender3-2018.cfg.
#
# Everything once tagged CHECK has been verified on the printer (first power-on, docs/05).
#
# See docs/05-first-power-on.md for the commissioning order.

[include mainsail.cfg]
[include macros.cfg]
[include KAMP_Settings.cfg]   # KAMP Smart Park + Line Purge (docs/04-mainsailos.md 4b); the file includes ./KAMP/*.cfg
[include speed_test.cfg]  # CrydTeam MAX_ACCEL_TEST / MAX_VELOCITY_TEST / MAX_SCV_TEST / BENCHMARK (upstream 2025-09-30)
# The CrydTeam tests detect skipped steps through these two sections: they
# record each stepper's position at every homing and change no behaviour.
[endstop_phase stepper_x]
[endstop_phase stepper_y]
#[include adxl.cfg]      # ADXL345 on the Pico over USB: uncomment while the Pico is plugged in (docs/06-tuning.md)
#[include shell.cfg]    # FLASH_MCU and SHAPER_PLOT buttons: uncomment after installing gcode_shell_command (docs/03 §5b)

# Remembers the dashboard choices (nozzle size for the KAMP purge, pressure advance) across
# restarts; Klipper creates the file.
[save_variables]
filename: ~/printer_data/config/variables.cfg

########################################
# MCU / host
########################################

[mcu]
# Run  ls /dev/serial/by-id/  on the Pi and paste the full path here.
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_<serial>-if00   # yours from ls /dev/serial/by-id/ after flashing (docs/03 §4)
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 255       # reference build, MAX_VELOCITY_TEST at 3900 mm/s2: X passes 320, skips 340; Y passes 420,
                        # skips 440. 80 % of the lower (X) ceiling. The Sprite makes X the heavier axis.
max_accel: 3900         # reference build, SHAPER_CALIBRATE: Y mzv 36.2 Hz allows <= 3900, X mzv 48.2 Hz <= 6800;
                        # one limit for both axes, so Y sets it. Until your own shaper run: SET_VELOCITY_LIMIT ACCEL=1500
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor skr3_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

########################################
# X / Y
########################################

[stepper_x]
step_pin: PD4
dir_pin: !PD3           # verified with STEPPER_BUZZ on the printer (plain PD3 ran backwards)
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1       # X-STOP header
position_endstop: 1     # measured on the reference build with the Sprite (SKR Mini E3 config): a true 0,0 and centred home
position_min: 1
position_max: 235
homing_speed: 75

[tmc2209 stepper_x]
uart_pin: PD5
run_current: 0.600              # as run on the SKR Mini E3
stealthchop_threshold: 999999   # set to 0 for spreadCycle if you see VFA / lost steps

[stepper_y]
step_pin: PA15
dir_pin: !PA8           # verified with STEPPER_BUZZ on the printer
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3       # Y-STOP header
position_endstop: -11   # measured on the reference build (SKR Mini E3 config)
position_min: -11
position_max: 233
homing_speed: 75

[tmc2209 stepper_y]
uart_pin: PD0
run_current: 0.580
stealthchop_threshold: 999999

########################################
# Z (two independent motors)
########################################

# Left lead screw (stock motor) -> ZAM socket.  Do NOT use ZBM, it is
# paralleled with ZAM on the same driver.
[stepper_z]
step_pin: PE2
dir_pin: PE3            # verified with STEPPER_BUZZ on the printer (lifts the gantry)
enable_pin: !PE0
microsteps: 16
rotation_distance: 8    # T8x8 lead screw (8 mm per rev). Stock Ender 3 Pro.
endstop_pin: probe:z_virtual_endstop
position_min: -5        # lets PROBE_CALIBRATE go below 0
position_max: 235       # top braces fitted: do not raise
homing_speed: 10
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 0.600              # as run on the SKR Mini E3 (one motor then; two drivers now)
stealthchop_threshold: 999999

# Right lead screw -> E1M socket (the E1 driver position).
[stepper_z1]
step_pin: PD11
dir_pin: !PD10          # verified with STEPPER_BUZZ on the printer (right-hand kit, re-pinned cable)
enable_pin: !PD13
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PD12
run_current: 0.600
stealthchop_threshold: 999999

# Enables FORCE_MOVE / SET_KINEMATIC_POSITION: moving one Z stepper on its
# own from the console, to check that each lead screw delivers the distance
# it is asked for (docs/06). Not used by anything automatic.
[force_move]
enable_force_move: True

# Where the two lead screws are, in bed coordinates, and where to probe.
# z_positions only set the lever arm the correction is computed with, so
# "roughly right" is fine. From Creality's Ender-3 CAD the stock (left) lead
# screw centre line is 27.7 mm outside the bed's X=0 edge; the right-hand
# screw is assumed to mirror it on the other upright (235 + 27.7).
[z_tilt]
z_positions:
    -27.7, 117.5        # left screw (from CAD)
    262.7, 117.5        # right screw: the right-hand kit is mirrored (confirmed)
points:                 # two points on the bed's Y centreline, nozzle positions:
    58.5, 158.5         # left screw line (same X as screws_tilt_adjust's screw1/screw4)
    228.5, 158.5        # right screw line (same X as screw2/screw3)
# No centre point: two Z motors define a line, and the centre only reports the
# bed's crown (measured 0.040 mm, constant over 10 rounds) which no tilt can
# remove and which bed mesh handles. With it in, the range could never close.
speed: 100
horizontal_move_z: 5
retries: 10             # the right screw delivers ~60 % of each correction, so allow more rounds
retry_tolerance: 0.025  # above the probe's own range (0.015); tighter is a coin toss

########################################
# Extruder / hotend
########################################

# Creality Sprite Pro direct drive: 42:12 reduction (3.5:1) on a pancake motor,
# all-metal hotend rated to 300 C.
[extruder]
step_pin: PD15
dir_pin: !PD14          # ran backwards on the first print (STEPPER_BUZZ does not show direction); inverted
enable_pin: !PC7
microsteps: 16
rotation_distance: 7.4088   # calibrated on this Sprite Pro (SKR Mini E3 config); no gear_ratio, the ratio is in the number
nozzle_diameter: 0.800      # 0.8 nozzle fitted (confirmed)
filament_diameter: 1.750
max_extrude_only_distance: 120
max_extrude_cross_section: 50   # as before: big purge lines and the 0.8 nozzle
heater_pin: PB3                 # HE0 terminal
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2                 # TH0 header
control: pid
# PID from this Sprite Pro on the SKR Mini E3 (same heater and thermistor). Re-run PID_CALIBRATE anyway.
pid_Kp: 17.605
pid_Ki: 0.93
pid_Kd: 82.525
min_temp: 0
max_temp: 300                   # Sprite Pro all-metal hotend (plain Sprite: 260)
min_extrude_temp: 170
pressure_advance: 0.04          # direct drive: tune between 0.02 and 0.06
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.700              # as run on the SKR Mini E3
stealthchop_threshold: 999999

[heater_fan hotend_fan]
pin: PB6                # FAN1 header
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

########################################
# Bed
########################################

[heater_bed]
heater_pin: PD7         # HB terminal
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1         # TB header
control: pid
# PID from this bed on the SKR Mini E3. Re-run PID_CALIBRATE anyway.
pid_Kp: 71.959
pid_Ki: 1.744
pid_Kd: 742.075
min_temp: 0
max_temp: 130

########################################
# Fans
########################################

[fan]
pin: PB7                # FAN0 header: part cooling blower

# Driven by _ENCLOSURE_FAN_CTRL in macros.cfg (every 10 s): on while any stepper is
# enabled or a heater has a target, for 60 s after that stops, and whenever the board's
# MCU is 45 C or more (off again below 40 C). A manual change in Mainsail is overridden
# within 10 s. Was a [controller_fan], which cannot watch a temperature.
[fan_generic enclosure_fan]
pin: PB5                # FAN2 header: 40 mm fan in the enclosure's front wall

########################################
# Probe / homing / bed levelling
########################################

# CR Touch on the Sprite's side bracket. Klipper drives a CR Touch as a BLTouch.
[bltouch]
sensor_pin: ^PC13       # "Probe" 2-pin header
control_pin: PE5        # "SERVOS" 3-pin header
x_offset: -32           # measured on the reference build (SKR Mini E3 config)
y_offset: -41
z_offset: 2.105         # reference build; PROBE_CALIBRATE -> SAVE_CONFIG writes yours
speed: 5
lift_speed: 10
samples: 2
sample_retract_dist: 2        # enough to re-arm a CR Touch; 7 only added travel time
pin_move_time: 0.5
samples_tolerance: 0.03       # ~2x the measured range (PROBE_ACCURACY: range 0.015, sd 0.005)
samples_tolerance_retries: 3
stow_on_each_sample: false
probe_with_touch_mode: true     # set false for a genuine BLTouch v3.1 if it misbehaves

[safe_z_home]
home_xy_position: 149.5, 158.5  # nozzle position that puts the probe at bed centre (117.5, 117.5)
speed: 100
z_hop: 10
z_hop_speed: 5

# Adaptive (per-print-area) meshing: START_PRINT runs BED_MESH_CALIBRATE
# ADAPTIVE=1, which reads the object outlines the slicer embeds and probes only
# the area they cover plus adaptive_margin. Needs [exclude_object] (below),
# "Label objects" on in the slicer and enable_object_processing in Moonraker
# (docs/04-mainsailos.md). With no object data it falls back to the full mesh.
[bed_mesh]
speed: 120
horizontal_move_z: 6
mesh_min: 25, 40        # probe coordinates (the probe is 32 left / 41 ahead of the nozzle): front-left screw
mesh_max: 196.5, 192    # rear-right screw; nozzle Y stays within 233
probe_count: 5, 5       # full-bed density; the adaptive mesh scales this to the print area
adaptive_margin: 5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

# Manual bed screws, for the Y direction the dual-Z gantry level cannot touch
# (Z_TILT_ADJUST only makes the X gantry parallel to the bed; front-to-back is
# the four knobs). SCREWS_TILT_CALCULATE probes next to each screw and prints
# how far to turn each knob; the SCREWS_TILT macro runs it after a gantry level.
# Positions are NOZZLE coordinates that put the CR Touch (32 left, 41 ahead of
# the nozzle) over each screw, measured on the reference build (SKR Mini E3 config).
[screws_tilt_adjust]
screw1: 58.5, 71.5
screw1_name: front left screw
screw2: 228.5, 71.5
screw2_name: front right screw
screw3: 228.5, 233
screw3_name: rear right screw
screw4: 58.5, 233
screw4_name: rear left screw
horizontal_move_z: 10
speed: 200
screw_thread: CW-M4

########################################
# Quality-of-life
########################################

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]
[respond]
[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 43200          # 12 h idle: then heaters off and motors released (Klipper's default action).
                        # END_PRINT releases the motors at the end of every print regardless.
gcode:
    TURN_OFF_HEATERS
    M84

# Filament runout switch (fitted) on E0DET: +5V, GND, signal PC2.
# QUERY_FILAMENT_SENSOR SENSOR=runout must say "filament detected" with filament
# in the sensor and "filament not detected" without; if it is the other way
# round, change the pin to !PC2 (a plain two-wire microswitch instead needs the pull-up: ^PC2).
[filament_switch_sensor runout]
switch_pin: PC2         # three-wire sensor with its own LED/driver: no pull-up. QUERY_FILAMENT_SENSOR to confirm the polarity
pause_on_runout: False  # _RUNOUT_START (macros.cfg) keeps printing until the filament between the
                        # sensor and the extruder gears is used up, then runs M600
runout_gcode:
    _RUNOUT_START
insert_gcode:
    _RUNOUT_INSERTED
event_delay: 3.0
pause_delay: 0.5

[firmware_retraction]
retract_length: 0.8     # direct drive; tune 0.5-1.2. Enable "firmware retraction" in the slicer.
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

# Input shaper measured on this frame with the SKR Mini E3 (stock rubber feet).
# The section stays here (empty) so SHAPER_CALIBRATE -> SAVE_CONFIG can write its result into the
# auto-save block at the bottom: SAVE_CONFIG refuses to save an option that is also set up here.
# Left empty on purpose: SHAPER_CALIBRATE + SAVE_CONFIG write your values here (Klipper refuses to save
# an option that is also set in the main file). The reference build measured X mzv 48.2 Hz, Y mzv 36.2 Hz
# with max_accel 3900; a bed slinger's Y peak is mostly belt tension.
[input_shaper]

########################################
# Optional hardware (uncomment to use)
########################################


# Accelerometer: config/adxl.cfg (ADXL345 on a Raspberry Pi Pico over USB), included from the top of this file.

# Stock Creality 12864 display on its own ribbon, plugged straight into EXP1.
# No re-pinning: Klipper only needs to know which GPIO each display signal lands
# on. The SKR Mini E3's EXP1 is wired in Creality's order, so its config tells us
# which ribbon position carries what; here the same positions map onto the
# SKR 3 EZ's EXP1 pins. (Mini pin -> function -> SKR 3 pin: 1 beeper PC5,
# 2 click PB0, 3 encoder PB1, 4 LCD reset PE8, 5 encoder PE9, 6 sclk PE10,
# 7 en PE11, 8 mosi PE12, 9 GND, 10 5V.)  Verified on the printer: screen, knob, click, BEEP.
[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PE7      # the display never talks back; any unconnected pin (EXP2_3) satisfies the driver
spi_software_mosi_pin: PE12     # EXP1_8
spi_software_sclk_pin: PE10     # EXP1_6
en_pin: PE11                    # EXP1_7
encoder_pins: ^PE9, ^PB1        # EXP1_5, EXP1_3
click_pin: ^!PB0                # EXP1_2

[static_digital_output lcd_reset]
pins: PE8                       # EXP1_4: the display's reset line, held high (not reset)

[output_pin _beeper]          # leading underscore: Mainsail hides it from the Miscellaneous panel (no slider); BEEP / M300 drive it
pin: PC5                        # EXP1_1, the buzzer on the display board
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001               # 1 kHz tone at VALUE=0.5; M300 / BEEP macros in macros.cfg

########################################
# Board pin aliases (from Klipper's generic-bigtreetech-skr-3.cfg)
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE9,  EXP1_7=PE11, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE8, EXP1_6=PE10, EXP1_8=PE12, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

# Klipper appends a SAVE_CONFIG block below this line after PID_CALIBRATE,
# PROBE_CALIBRATE, BED_MESH_CALIBRATE etc. Keep it; copy it back to the repo.
