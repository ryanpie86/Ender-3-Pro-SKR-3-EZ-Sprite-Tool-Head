# Dashboard buttons that run scripts on the Pi:
#   FLASH_MCU    tools/flash_skr3.sh   rebuild Klipper, flash the SKR 3 EZ (and the Pico) over USB via Katapult
#   SHAPER_PLOT  tools/shaper_plot.sh  render the latest SHAPER_CALIBRATE data to config/shaper_x.png, shaper_y.png
#
# Needs the gcode_shell_command extra in Klipper (KIAUH -> Extensions -> G-Code Shell Command,
# or the one-liner in docs/03 §5b). Without it Klipper rejects this file: comment the include out
# in printer.cfg until the extra is installed.
#
# FLASH_MCU stops the Klipper service, and systemd kills everything in the service's cgroup when it
# stops, the shell command included, so it is started through sudo systemd-run as its own transient
# unit; output in printer_data/logs/flash_skr3.log. That needs sudo without a password for the
# MainsailOS user (docs/03 §5b, one sudoers line). No username is baked in: the commands resolve
# $HOME and $(id -un) at run time. They assume this repo is cloned to ~/Ender-3-Pro-SKR-3-EZ-Sprite-Tool-Head.

[gcode_shell_command flash_skr3]
command: bash -c 'exec sudo systemd-run --unit=flash-skr3 --collect --no-block -p User=$(id -un) -p WorkingDirectory=$HOME -p StandardOutput=append:$HOME/printer_data/logs/flash_skr3.log -p StandardError=inherit $HOME/Ender-3-Pro-SKR-3-EZ-Sprite-Tool-Head/tools/flash_skr3.sh'
timeout: 30
verbose: True

[gcode_macro FLASH_MCU]
description: Rebuild Klipper and flash the SKR 3 EZ (and the ADXL Pico when plugged in) over USB. Klipper goes offline for a minute or two and comes back by itself. Log: logs/flash_skr3.log
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        { action_raise_error("FLASH_MCU: not while printing") }
    {% endif %}
    RESPOND TYPE=command MSG="FLASH_MCU: building and flashing in the background. Klipper will disconnect and reconnect on its own; follow logs/flash_skr3.log."
    RUN_SHELL_COMMAND CMD=flash_skr3

[gcode_shell_command shaper_plot]
command: bash -c '$HOME/Ender-3-Pro-SKR-3-EZ-Sprite-Tool-Head/tools/shaper_plot.sh'
timeout: 180
verbose: True

[gcode_macro SHAPER_PLOT]
description: Render the latest SHAPER_X / SHAPER_Y data to shaper_x.png and shaper_y.png in the config folder (Machine tab, download). Needs python3-matplotlib on the Pi
gcode:
    RESPOND TYPE=command MSG="SHAPER_PLOT: rendering the newest calibration data, 20-60 s per axis..."
    RUN_SHELL_COMMAND CMD=shaper_plot
